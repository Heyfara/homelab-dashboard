; Workers PHP-FPM du dashboard. Au chargement de la page, toutes les cartes
; interrogent l'API en même temps (une trentaine), et une carte dont la source
; est relue en arrière-plan (CardDataFetcher) garde son worker quelques
; secondes après sa réponse : les 5 workers par défaut faisaient la queue.
; ~20 Mo par worker.
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
