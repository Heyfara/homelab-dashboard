# Conf nginx du dashboard. Sert de référence pour le rôle Ansible service-dashboard
# (nginx partagé du serveur) et sert telle quelle en dev (compose.yaml).
server {
    listen 80;
    server_name dashboard.example localhost;
    root /app/public;

    # Résoudre le nom du container PHP à chaque requête (DNS interne de Docker) :
    # sinon nginx garde l'adresse du container d'avant une mise à jour → 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream dashboard:9000;

    # API Symfony
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    # Fichiers produits par Vite : noms hashés, cache long
    location /build/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Toute autre URL (/, /tom…) : l'appli React
    location / {
        try_files $uri /build/index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # Chemin dans le container PHP-FPM : nginx n'a pas besoin du code PHP
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
