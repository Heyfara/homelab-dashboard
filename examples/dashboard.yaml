# Configuration d'exemple, fictive : elle sert de modèle et aux vérifications
# de la CI (dashboard:lint). En dev, la config réelle est dans
# dashboard.local.yaml (non versionné, voir docs/developpement.md) ; en prod,
# elle vient du rôle Ansible service-dashboard.
# Référence complète : docs/configuration.md

settings:
  columns: 4          # colonnes de la grille sur grand écran
  refresh: 30         # secondes entre deux rafraîchissements d'une carte

hosts:
  serveur:
    beszel: Serveur   # nom du système dans Beszel
  box: ~              # machine sans agent Beszel : sonde HTTP seulement

services:
  photos:
    name: Photos
    description: Galerie de la famille
    url: https://photos.example
    check: http://192.0.2.10:2283
    icon: sh-immich
    host: serveur
    container: photos_server
  recettes:
    name: Recettes
    description: Livre de cuisine
    url: https://recettes.example
    icon: sh-mealie
    host: serveur
    container: recettes
  dns:
    name: DNS
    description: Résolution des noms et anti-pub
    url: https://dns.example/admin
    icon: sh-pi-hole
    host: box
  papiers:
    name: Papiers
    description: Documents scannés
    url: https://papiers.example
    check: http://192.0.2.10:8000
    icon: sh-paperless-ngx
    host: serveur
  maison:
    name: Maison connectée
    url: https://maison.example
    check: http://192.0.2.10:8123
    icon: sh-home-assistant
    host: serveur
  gazette:
    name: Gazette
    description: Le journal de la famille
    url: https://gazette.example
    icon: https://gazette.example/build/favicon.svg   # l'icône servie par l'appli
    host: serveur

notifications:
  url: http://10.0.0.2:2586
  link: https://ntfy.example
  topics:
    urgent: Urgent
    maison: Maison

profiles:
  admin:
    name: Admin
    color: indigo
    notifications: [urgent, maison]
    sections:
      - title: Services
        cards:
          - { type: service, service: photos }
          - { type: service, service: recettes }
          - { type: service, service: dns }
          - { type: factures, service: papiers, span: 2, rows: 2, refresh: 3600 }
          - { type: gazette, service: gazette, rows: 2, refresh: 3600 }
      - title: Énergie
        tab: Maison
        cards:
          - { type: energy, service: maison, solar_power: sensor.panneaux_puissance, grid_power: sensor.compteur_puissance, span: 2, rows: 2, refresh: 60 }
          - { type: temperatures, service: maison, outdoor: jardin, span: 2, rows: 2, refresh: 300 }
      - title: Jeux
        tab: Jeux
        cards:
          # Horaire des boss du monde ; les coches viennent de la clé saisie dans « Ma config »
          - { type: gw2-bosses, credentials: profile, count: 4, span: 2, refresh: 300 }
      - title: Réseau
        tab: Réseau
        cards:
          # Seule dans sa section : hauteur selon le contenu. Type et nom par MAC si la Freebox se trompe.
          - type: network
            span: 4
            devices:
              "00:16:3E:00:00:01": { type: server, name: serveur }
  famille:
    name: Famille
    color: rose
    sections:
      - title: Au quotidien
        columns: 3
        cards:
          - type: service
            service: photos
            span: 2
          - { type: service, service: recettes }
