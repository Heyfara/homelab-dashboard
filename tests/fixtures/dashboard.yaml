profiles:
  alice:
    name: Alice
    color: indigo
    sections:
      - title: Services
        cards:
          - type: service
            service: photos
          - type: service
            id: recettes-alice
            title: Cuisine
            service: recettes
            span: 2
            rows: 2
            refresh: 60
      - title: Large
        columns: 2
        cards: []
  bob:
    name: Bob
    sections:
      - title: Au quotidien
        cards:
          - type: service
            service: recettes
          - type: jellyfin-latest
            service: films
            user: bob
            limit: 2
            span: 2
            rows: 2
          - { type: qbittorrent, service: torrents, span: 2, rows: 2 }
          - { type: c411, service: c411, span: 2, rows: 2, refresh: 60 }
          - { type: machine, host: alpha, span: 2, rows: 2, disk_names: { media: RAID } }
          - { type: containers, host: alpha, span: 2, rows: 2 }
          - { type: backblaze, span: 2, rows: 2, refresh: 86400 }
          - { type: mealie, service: cuisine, span: 2, rows: 2 }
          - { type: github-prs, repos: [exemple/infra, exemple/app], author: app/renovate, api: https://api.github.test, span: 2, rows: 2 }
          - { type: audiobookshelf, service: audio, span: 2, rows: 2 }
          - { type: immich, service: galerie, span: 2, rows: 2 }
          - { type: calibre-web, service: liseuse, span: 2, rows: 2 }
          - { type: backups, url: http://10.0.0.9:3000/images/backup-status.json, aliases: { cuisine: cuisine }, span: 2, rows: 2 }
          - { type: bricktracker, service: lego, span: 2, rows: 2 }
          - { type: weather, place: Village fictif, latitude: 45.0, longitude: 5.0, api: https://meteo.test, span: 2, rows: 2 }
          - { type: music-assistant, service: musique, span: 2, rows: 2 }
          - { type: jelu, service: lectures, readers: { alice: Alice, bob: Bob }, span: 2, rows: 2 }
          - { type: crafty, service: minecraft, public: [Public], span: 2, rows: 2 }
          - { type: minecraft, service: minecraft, server: Monde survie, image: 'https://images.example/minecraft/famille.png', span: 2, rows: 3 }
          - { type: gw2, api: https://gw2.test, span: 2, rows: 2 }
          - { type: gw2, id: gw2-profil, credentials: profile, api: https://gw2.test, span: 2, rows: 2 }
          - { type: weather, id: meteo-profil, place: Village fictif, latitude: 45.0, longitude: 5.0, location: profile, api: https://meteo.test, span: 2, rows: 2 }
