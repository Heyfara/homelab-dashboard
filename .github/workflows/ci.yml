name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: apcu
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Dépendances
        run: |
          composer install --no-progress --prefer-dist
          npm ci --no-audit --no-fund

      - name: Tests PHP
        run: vendor/bin/phpunit

      - name: Lint Symfony et config d'exemple
        run: |
          bin/console lint:container
          bin/console lint:yaml config examples
          bin/console dashboard:lint

      - name: Types de carte PHP (comparés au registre React par vitest)
        run: bin/console dashboard:card-types > "$RUNNER_TEMP/card-types.txt"

      - name: Tests front
        env:
          CARD_TYPES_FILE: ${{ runner.temp }}/card-types.txt
        run: |
          npm run typecheck
          npm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image de prod (construite, pas publiée)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
